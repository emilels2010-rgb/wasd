name: Deploy PS99 Odds Atlas
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the current PS99 odds snapshot
        run: node ps99-odds-atlas/scripts/build-pages.mjs
        env:
          PS99_OUTPUT_DIR: dist-pages
      - name: Publish snapshot files at the main site root
        shell: bash
        run: |
          cp dist-pages/index.html index.html
          cp dist-pages/data.json data.json
          cp dist-pages/thumbnails.json thumbnails.json
          cp dist-pages/.nojekyll .nojekyll
          git add index.html data.json thumbnails.json .nojekyll
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh PS99 Odds Atlas data snapshot"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
